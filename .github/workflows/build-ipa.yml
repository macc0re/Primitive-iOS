name: Build Primitive IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Primitive/**"
      - "project.yml"
      - "Vendor/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 27 toolchain
        run: xcodebuild -version

      - name: Fetch pinned Airlift framework
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Mak5er/AirCard-iOS.git /tmp/AirCard-iOS
          git -C /tmp/AirCard-iOS fetch --depth 1 origin 40640c4d827aeab8d798285b57d24fcf6be070d0
          git -C /tmp/AirCard-iOS sparse-checkout init --cone
          git -C /tmp/AirCard-iOS sparse-checkout set AirliftFFI.xcframework
          git -C /tmp/AirCard-iOS checkout --detach 40640c4d827aeab8d798285b57d24fcf6be070d0
          mkdir -p Vendor
          cp -R /tmp/AirCard-iOS/AirliftFFI.xcframework Vendor/
          test -f Vendor/AirliftFFI.xcframework/ios-arm64/Headers/airlift.h

      - name: Prepare app icon
        run: sips -z 1024 1024 Primitive/Assets.xcassets/AppIcon.appiconset/AppIcon.png --out Primitive/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Primitive.xcodeproj \
            -scheme Primitive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Primitive.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Primitive-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Primitive-0.1.0-unsigned-ipa
          path: Primitive-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
