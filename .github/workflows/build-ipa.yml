name: Build Primitive IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Primitive/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Prepare app icon
        run: sips -z 1024 1024 Primitive/Assets.xcassets/AppIcon.appiconset/AppIcon.png --out Primitive/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Primitive.xcodeproj \
            -scheme Primitive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Primitive.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Primitive-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Primitive-0.1.0-unsigned-ipa
          path: Primitive-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
