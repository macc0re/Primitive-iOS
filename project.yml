name: Primitive
options:
  bundleIdPrefix: com.mac.core
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_CFBundleDisplayName: Primitive
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CODE_SIGN_STYLE: Automatic
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  Primitive:
    type: application
    platform: iOS
    sources:
      - path: Primitive
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
      - framework: Vendor/AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mac.core.primitive
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleShortVersionString: "0.1.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        OTHER_LDFLAGS: "-lc++"
    info:
      properties:
        NSLocalNetworkUsageDescription: "Primitive advertises a local pairing service so iOS Developer Mode can pair this iPhone with Primitive."
        NSBonjourServices:
          - _remotepairing-pairable-host._tcp
          - _aircardprobe._tcp
        UIBackgroundModes:
          - audio
